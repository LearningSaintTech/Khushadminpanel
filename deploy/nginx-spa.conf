# SPA hosting for Khushadminpanel `dist/` (nginx example)
#
# MIME error "Expected JavaScript but got text/html" means /assets/*.js is
# returning index.html — usually missing dist/assets on the server or SPA
# fallback applied to static files.
#
# Deploy the FULL dist/ folder (index.html + assets/ directory).

server {
    listen 80;
    server_name admin.example.com;

    # Path to `npm run build` output
    root /var/www/khushadminpanel/dist;
    index index.html;

    # Hashed JS/CSS — never fall back to index.html
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA client routes only
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: frame-ancestors only works as HTTP header (not <meta> CSP)
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# If the panel is served under a subpath (e.g. /admin/), set in .env before build:
#   VITE_BASE_PATH=/admin/
# and use:
#   location /admin/assets/ { alias /var/www/khushadminpanel/dist/assets/; try_files $uri =404; }
#   location /admin/ { alias /var/www/khushadminpanel/dist/; try_files $uri $uri/ /admin/index.html; }
